name: bot-test

on:
  pull_request:

jobs:
  bot-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install -r discord_bot/requirements.txt
      - name: 봇 단위 테스트
        working-directory: discord_bot
        run: pytest -v
