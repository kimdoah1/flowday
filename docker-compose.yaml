
services:
  db:
    image: postgres:16-alpine
    container_name: calendar-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: calendar-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - audio-data:/data/audio
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: calendar-frontend
    ports:
      - "80:80"
    depends_on:
      - api

  meeting-worker:
    build: ./meeting_worker
    container_name: calendar-meeting-worker
    env_file:
      - .env
    volumes:
      - audio-data:/data/audio
    depends_on:
      - api

  discord-bot:
    build: ./discord_bot
    container_name: calendar-discord-bot
    env_file:
      - .env
    depends_on:
      - api

volumes:
  db-data:
  audio-data:
