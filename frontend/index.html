<script>
const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const TODAY=new Date();TODAY.setHours(12,0,0,0);const dateOffset=n=>iso(addDays(TODAY,n));const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const humanDate=s=>{const d=new Date(s+'T12:00:00');return `${d.getMonth()+1}월 ${d.getDate()}일`};
const starter=()=>({tasks:[{id:'t1',title:'프로젝트 요구사항 정리',date:dateOffset(0),source:'plan',done:true},{id:'t2',title:'캘린더 UI 컴포넌트 구현',date:dateOffset(1),source:'plan',done:false},{id:'t3',title:'AI 일정 추출 API 설계',date:dateOffset(3),source:'plan',done:false},{id:'t4',title:'팀 주간 회의',date:dateOffset(4),source:'meeting',done:false},{id:'t5',title:'Docker Compose 구성',date:dateOffset(6),source:'chat',done:false}],proposals:[{id:'p1',title:'프론트엔드 1차 시안 리뷰',date:dateOffset(2),source:'Discord',text:'@팀원 이번 주 일요일까지 프론트 시안 확인 부탁해요.'},{id:'p2',title:'API 명세 공유',date:dateOffset(5),source:'Discord',text:'백엔드 API 명세는 다음 주 수요일까지 공유할게요.'},{id:'p3',title:'중간 점검 회의',date:dateOffset(7),source:'메신저',text:'다음 주 금요일에 중간 점검 회의 진행합시다.'}],lastPlan:null,lastMeeting:null,log:[]});let state;try{state=JSON.parse(localStorage.getItem('flowday-demo-v1'))||starter()}catch{state=starter()}const save=()=>{try{localStorage.setItem('flowday-demo-v1',JSON.stringify(state))}catch(e){console.warn('Local storage unavailable',e)}};let currentView='calendar',calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),selectedDate=dateOffset(0),toastTimer;
const names={dashboard:'대시보드',calendar:'캘린더',planner:'AI 계획 세분화',meetings:'회의록 분석',inbox:'채팅 일정 추출'};function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}function go(view){currentView=view;document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));$('#breadcrumb').textContent=names[view];render();window.scrollTo({top:0,behavior:'smooth'})}function taskType(source){return source==='meeting'?'회의록':source==='chat'?'채팅':'AI 계획'}function typeClass(source){return source==='meeting'?'badge-green':source==='chat'?'badge-blue':'badge-purple'}function getThisWeekTasks(){return state.tasks.filter(t=>{const diff=(new Date(t.date+'T12:00')-TODAY)/86400000;return diff>=-2&&diff<8}).sort((a,b)=>a.date.localeCompare(b.date))}function taskMarkup(t){return `<div class="task-row"><button class="task-check ${t.done?'done':''}" aria-label="${t.done?'완료 취소':'완료 처리'}" data-toggle-task="${escapeHTML(t.id)}">${t.done?'✓':''}</button><div class="task-label"><strong class="${t.done?'done':''}">${escapeHTML(t.title)}</strong><small>${humanDate(t.date)} · 넥스트 프로젝트</small></div><span class="task-badge ${typeClass(t.source)}">${taskType(t.source)}</span></div>`}
function monthCells(d){const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),offset=first.getDay(),days=new Date(y,m+1,0).getDate();return Array.from({length:42},(_,i)=>{const day=new Date(y,m,i-offset+1);return {date:iso(day),day:day.getDate(),outside:day.getMonth()!==m}})}function monthTitle(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월`}function smallCalendar(){return `<div class="panel"><div class="panel-head"><div><h3 class="panel-title">미니 캘린더</h3><div class="panel-sub">일정을 한눈에 확인하세요</div></div><button class="text-button" data-goto="calendar">전체 보기 ↗</button></div><div class="mini-calendar-header"><span>${monthTitle(calendarMonth)}</span><span><button data-month="-1">‹</button> <button data-month="1">›</button></span></div><div class="calendar-weekdays">${['일','월','화','수','목','금','토'].map(s=>`<span>${s}</span>`).join('')}</div><div class="calendar-days">${monthCells(calendarMonth).map(day=>`<button class="calendar-day ${day.outside?'outside':''} ${day.date===dateOffset(0)?'today':''} ${day.date===selectedDate?'selected':''}" data-date="${day.date}"><span class="day-number">${day.day}</span><span class="dots">${state.tasks.some(t=>t.date===day.date)?'<span></span>':''}</span></button>`).join('')}</div><div class="upcoming"><div class="split-header"><h3 class="panel-title">다가오는 일정</h3><span class="muted" style="font-size:10px">최대 3개</span></div>${state.tasks.filter(t=>t.date>=dateOffset(0)&&!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(t=>`<div class="upcoming-row"><div class="upcoming-date"><strong>${Number(t.date.slice(-2))}</strong><small>${Number(t.date.slice(5,7))}월</small></div><div><strong>${escapeHTML(t.title)}</strong><small>${taskType(t.source)}에서 등록됨</small></div></div>`).join('')||'<div class="tip">예정된 일정이 없습니다.</div>'}</div></div>`}
function dashboard(){const tasks=getThisWeekTasks(),done=state.tasks.filter(t=>t.done).length;return `<div class="page-heading"><div><p class="eyebrow">YOUR TEAM, IN SYNC ✦</p><h1>좋은 오후예요! 👋</h1><p class="subtitle">흩어진 계획과 약속, 오늘도 flowday에서 한 번에 관리해요.</p></div><button class="btn primary" data-goto="planner">✦ AI로 새 계획 만들기</button></div><div class="stats"><div class="stat-card"><div class="stat-top">전체 할 일 <span class="stat-icon l-purple">▤</span></div><div class="stat-value">${state.tasks.length}</div><div class="stat-foot">캘린더에 등록된 항목</div></div><div class="stat-card"><div class="stat-top">완료한 작업 <span class="stat-icon l-green">✓</span></div><div class="stat-value">${done}</div><div class="stat-foot">전체 작업 중 ${state.tasks.length?Math.round(done/state.tasks.length*100):0}% 완료</div></div><div class="stat-card"><div class="stat-top">검토할 일정 <span class="stat-icon l-orange">◷</span></div><div class="stat-value">${state.proposals.length}</div><div class="stat-foot">채팅에서 감지된 일정</div></div><div class="stat-card"><div class="stat-top">이번 주 일정 <span class="stat-icon l-blue">▣</span></div><div class="stat-value">${tasks.length}</div><div class="stat-foot">오늘 전후 예정 작업</div></div></div><div class="hero-banner"><div><h2>할 일은 많아도, 계획은 가볍게 ✨</h2><p>목표와 마감일만 입력하면 실행 가능한 단계로 나눠 드려요.</p><button class="btn small" data-goto="planner">계획 시작하기 →</button></div><div class="hero-illustration">✦ ◌ ✧</div></div><div class="dashboard-grid"><div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">이번 주 할 일</h3><div class="panel-sub">실행할 항목을 정리하고 하나씩 완료해보세요</div></div><button class="text-button" data-goto="calendar">캘린더 보기 ↗</button></div>${tasks.slice(0,6).map(taskMarkup).join('')||'<div class="empty-note">이번 주 일정이 없습니다.</div>'}</section><div class="quick-actions"><button class="quick-action" data-goto="planner"><span class="quick-icon">✦</span><strong>AI 계획 생성</strong><small>큰 목표를 작은 작업으로</small></button><button class="quick-action" data-goto="meetings"><span class="quick-icon">◉</span><strong>회의록 분석</strong><small>결정 사항과 할 일 추출</small></button><button class="quick-action" data-goto="inbox"><span class="quick-icon">▤</span><strong>채팅 일정 수집</strong><small>놓친 약속 다시 확인</small></button></div></div>${smallCalendar()}</div>`}
function calendar(){return `<div class="page-heading"><div><p class="eyebrow">ALL IN ONE CALENDAR</p><h1>팀 캘린더</h1><p class="subtitle">AI 계획 · 회의록 · 채팅에서 추출한 모든 일정을 함께 관리합니다.</p></div><button class="btn primary" id="addTask">＋ 일정 직접 추가</button></div><div class="panel"><div class="calendar-toolbar"><div><h3 class="panel-title" style="font-size:18px">${monthTitle(calendarMonth)}</h3><p class="panel-sub">날짜를 클릭하면 해당 일정을 확인할 수 있어요.</p></div><div><button data-month="-1">‹</button> <button data-calendar-today="1" style="width:auto;padding:0 12px;font-size:11px">오늘</button> <button data-month="1">›</button></div></div><div class="calendar-week-labels">${['일','월','화','수','목','금','토'].map(s=>`<span>${s}</span>`).join('')}</div><div class="big-calendar">${monthCells(calendarMonth).map(day=>{const events=state.tasks.filter(t=>t.date===day.date);return `<div class="big-day ${day.outside?'outside':''} ${day.date===dateOffset(0)?'today':''} ${day.date===selectedDate?'selected':''}" data-date="${day.date}"><span class="big-day-number">${day.day}</span>${events.slice(0,3).map(t=>`<span class="event-chip ${t.source==='meeting'?'meeting':t.source==='chat'?'chat':''}">${t.done?'✓ ':''}${escapeHTML(t.title)}</span>`).join('')}${events.length>3?`<span class="tip">+${events.length-3}개 더보기</span>`:''}</div>`}).join('')}</div><div class="calendar-footer"><span class="legend"><span class="legend-dot"></span> AI 계획</span><span class="legend"><span class="legend-dot" style="background:#2bb49a"></span> 회의록</span><span class="legend"><span class="legend-dot" style="background:#5596e5"></span> 채팅</span></div></div><div class="panel" style="margin-top:19px"><div class="panel-head"><div><h3 class="panel-title">${humanDate(selectedDate)} 일정</h3><div class="panel-sub">선택한 날짜의 등록 내역</div></div><button class="text-button" id="addSelectedTask">＋ 일정 추가</button></div>${state.tasks.filter(t=>t.date===selectedDate).map(taskMarkup).join('')||'<div class="empty-note">이 날짜에는 등록된 일정이 없습니다.</div>'}</div>`}
function planner(){return `<div class="page-heading"><div><p class="eyebrow">SMART PROJECT PLANNER</p><h1>✦ AI 계획 세분화</h1><p class="subtitle">큰 목표와 마감일을 입력하면 주차별·단계별 실행 계획을 제안합니다.</p></div></div><div class="two-column"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">새로운 목표 설정</h3><p class="panel-sub">프로젝트의 핵심 정보를 입력해 주세요.</p></div><span class="task-badge badge-purple">01 / INPUT</span></div><form id="planForm"><div class="field"><label for="planGoal">어떤 목표를 달성하고 싶나요?</label><input id="planGoal" required maxlength="100" value="오픈소스 SW 팀 프로젝트 완성" placeholder="예: 팀 프로젝트 웹 서비스 만들기"/></div><div class="field"><label for="planDesc">목표 상세 설명</label><textarea id="planDesc" placeholder="예: 웹 프론트엔드, API 서버, DB, Docker Compose 배포까지 완성">프론트엔드 구현, API 개발, 데이터베이스 연동, Docker Compose 및 GitHub Actions 설정</textarea></div><div class="form-inline"><div class="field"><label for="planDeadline">마감일</label><input type="date" id="planDeadline" required value="${dateOffset(28)}" min="${dateOffset(0)}"/></div><div class="field"><label for="planIntensity">작업 강도</label><select id="planIntensity"><option value="balanced">균형 있게</option><option value="light">여유 있게</option><option value="intense">집중적으로</option></select></div></div><button class="btn primary" type="submit" style="width:100%">✦ 단계별 계획 생성하기</button></form><div class="feature-box"><strong>데모 안내</strong><br/>현재 화면은 실제 AI 호출 없이 입력한 키워드와 기간에 따라 계획을 제안합니다. 실서비스에서는 LLM API와 일정 충돌·작업량 검증 로직을 연결할 수 있습니다.</div></section><section class="panel"><div class="panel-head"><div><h3 class="panel-title">생성된 실행 계획</h3><p class="panel-sub">초안 검토 후 한 번에 캘린더에 등록하세요.</p></div><span class="task-badge badge-green">02 / REVIEW</span></div><div id="planResult">${renderPlanResult()}</div></section></div>`}
function stepsFor(goal,desc,count){const txt=(goal+' '+desc).toLowerCase();let steps;if(/웹|앱|api|서비스|프론트|docker|배포|프로젝트/.test(txt)){steps=['요구사항 및 핵심 기능 확정','화면 설계와 사용자 흐름 정리','프론트엔드 주요 화면 구현','백엔드 API 및 데이터 구조 구현','데이터베이스·서비스 연동','Docker Compose와 볼륨 구성','GitHub Actions 테스트·배포 자동화','통합 테스트 및 사용자 피드백','최종 시연 자료와 발표 준비']}else if(/시험|공부|학습|자격증/.test(txt)){steps=['범위와 학습 목표 정리','핵심 개념 1차 학습','문제 풀이와 실습','취약 개념 보완','모의 평가 및 피드백','최종 복습 및 결과 정리']}else{steps=['목표 및 성공 기준 정의','필요 자료 조사와 우선순위 설정','1차 실행 및 중간 점검','핵심 산출물 완성','피드백과 개선','최종 검토 및 결과 공유']}return steps.slice(0,Math.max(3,Math.min(steps.length,count)))}function buildPlan(goal,desc,deadline,intensity){const total=Math.max(1,Math.ceil((new Date(deadline+'T12:00')-TODAY)/86400000));let steps=stepsFor(goal,desc,Math.ceil(total/4)+2);if(intensity==='light')steps=steps.filter((_,i)=>i%3!==2||i===steps.length-1);const start=addDays(TODAY,1),end=new Date(deadline+'T12:00');return {goal,deadline,steps:steps.map((title,i)=>({title,date:iso(new Date(Math.min(end.getTime(),start.getTime()+Math.max(0,((end-start)/Math.max(1,steps.length-1))*i))))}))}}function renderPlanResult(){const plan=state.lastPlan;if(!plan)return '<div class="result-empty"><div class="empty-icon">✧</div><strong>새 계획을 만들어 보세요</strong><p>프로젝트 목표와 마감일을 입력하면<br/>단계별 실행 계획이 이곳에 나타납니다.</p></div>';return `<div class="result-top"><strong>${escapeHTML(plan.goal)}</strong><p>마감일 ${humanDate(plan.deadline)} · ${plan.steps.length}단계</p></div><div class="steps">${plan.steps.map((s,i)=>`<div class="step-row"><div class="step-number">${pad(i+1)}</div><div class="step-body"><strong>${escapeHTML(s.title)}</strong><small>${humanDate(s.date)} 예정</small></div></div>`).join('')}</div><div class="result-action"><button class="btn primary" id="commitPlan">▣ ${plan.steps.length}개 일정 캘린더 등록</button></div>`}
const exampleMeeting=()=>`팀 프로젝트 주간 회의\n참석: 개발팀 전원\n\n결정: 프론트엔드 시안은 11월 12일까지 완료한다.\n결정: API 명세는 11월 15일까지 공유한다.\n회의: 11월 18일 오후 3시에 다음 점검 회의를 진행한다.\nDocker Compose 구성은 이후 백엔드 작업과 병행한다.`;function extractText(text,source){const lines=text.split(/[\n。.!?]+/).map(x=>x.trim()).filter(x=>x.length>5);const proposals=[];const cur=TODAY;for(const line of lines){if(!/(회의|까지|예정|마감|완료|공유|진행|리뷰|점검|제출|일정|하기로|부탁)/.test(line))continue;let date;const explicit=line.match(/(?:(\d{4})[./-]\s*)?(\d{1,2})월\s*(\d{1,2})일/);const slash=line.match(/(?:(\d{4})[./-])?(\d{1,2})[./-](\d{1,2})(?!\d)/);const m=explicit||slash;if(m){let year=m[1]?Number(m[1]):cur.getFullYear(),month=Number(m[2]),day=Number(m[3]);if(month>12||day>31||month<1||day<1)continue;date=new Date(year,month-1,day);if(!m[1]&&date<TODAY)date=new Date(year+1,month-1,day);if(date.getMonth()!==month-1)continue}else if(/다음\s*주\s*(월|화|수|목|금|토|일)요일/.test(line)){const dayMap={일:0,월:1,화:2,수:3,목:4,금:5,토:6};const target=dayMap[line.match(/다음\s*주\s*(월|화|수|목|금|토|일)요일/)[1]];date=addDays(cur,7-cur.getDay()+target)}else if(/내일/.test(line)){date=addDays(cur,1)}else if(/모레/.test(line)){date=addDays(cur,2)}else if(/이번\s*주\s*(월|화|수|목|금|토|일)요일/.test(line)){const target=dayMap2(line.match(/이번\s*주\s*(월|화|수|목|금|토|일)요일/)[1]);date=addDays(cur,target-cur.getDay());if(date<cur)date=addDays(date,7)}else continue;let title=line.replace(/^(결정|회의|일정|액션)\s*:\s*/,'').replace(/\d{4}[./-]\s*\d{1,2}[./-]\s*\d{1,2}/g,'').replace(/\d{1,2}월\s*\d{1,2}일/g,'').replace(/(?:이번|다음)\s*주\s*[월화수목금토일]요일/g,'').replace(/(?:까지|에는|에|부터)\s*/g,' ').replace(/오(?:전|후)\s*\d{1,2}시(?:\s*\d{1,2}분)?/g,'').replace(/\s+/g,' ').trim();title=title.slice(0,55)||'추출된 일정';proposals.push({id:'p'+Math.random().toString(36).slice(2,9),title,date:iso(date),source,text:line})}return proposals.slice(0,10)}function dayMap2(d){return {일:0,월:1,화:2,수:3,목:4,금:5,토:6}[d]}
function meeting(){return `<div class="page-heading"><div><p class="eyebrow">MEETING INTELLIGENCE</p><h1>◉ AI 회의록 분석</h1><p class="subtitle">회의 내용을 정리하고, 실제로 실행할 일정만 골라 캘린더에 등록합니다.</p></div></div><div class="two-column"><div class="panel"><div class="panel-head"><div><h3 class="panel-title">회의 내용 입력</h3><p class="panel-sub">녹음 파일 전사 결과나 회의 메모를 붙여 넣으세요.</p></div><span class="task-badge badge-purple">01 / INPUT</span></div><form id="meetingForm"><div class="field"><label for="meetingName">회의 이름</label><input id="meetingName" maxlength="70" value="팀 프로젝트 주간 회의" required/></div><div class="field"><label for="meetingText">회의 내용</label><textarea id="meetingText" style="min-height:245px" required placeholder="회의에서 나온 결정사항 및 마감일을 입력하세요...">${escapeHTML(exampleMeeting())}</textarea></div><button class="btn primary" type="submit" style="width:100%">✦ 요약 및 일정 추출</button></form><div class="feature-box"><strong>음성 업로드는 다음 개발 단계</strong><br/>이 데모는 텍스트 기반 분석만 지원합니다. 실제 녹음 전사는 Whisper 등 음성 인식 모델을 백엔드에 연결해야 합니다.</div></div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">회의 분석 결과</h3><p class="panel-sub">요약과 실행 항목을 검토하세요.</p></div><span class="task-badge badge-green">02 / REVIEW</span></div><div id="meetingResult">${renderMeetingResult()}</div></div></div>`}
function renderMeetingResult(){const r=state.lastMeeting;if(!r)return '<div class="result-empty"><div class="empty-icon">◉</div><strong>아직 분석한 회의가 없어요</strong><p>회의 기록을 입력하고 분석 버튼을 누르면<br/>요약과 일정 후보가 표시됩니다.</p></div>';return `<div class="result-top"><strong>${escapeHTML(r.name)}</strong><p>${r.items.length}개 일정 후보 추출 · 단순 규칙 기반 데모</p></div><div class="section-label">회의 요약 (원문 문장 발췌)</div><p class="helper">${escapeHTML(r.summary)}</p><hr class="divider"/><div class="section-label">일정 후보</div>${r.items.length?r.items.map(p=>proposalMarkup(p,true)).join(''):'<div class="empty-note">날짜가 포함된 일정 후보를 찾지 못했습니다.<br/>예: 11월 18일까지 API 명세 완료</div>'}<div class="result-action"><button class="btn primary" id="commitMeeting" ${r.items.length?'':'disabled'}>✓ 일정 후보 전체 등록</button></div>`}
function proposalMarkup(p,compact=false){return `<div class="proposal"><div class="source-icon" style="width:29px;height:29px;font-size:15px">${p.source==='Discord'?'#':p.source==='메신저'?'▤':'◉'}</div><div class="proposal-body"><strong>${escapeHTML(p.title)}</strong><p>${escapeHTML(p.text)}</p><span class="proposal-source">${humanDate(p.date)} · ${escapeHTML(p.source)}</span></div>${compact?'':`<div class="proposal-actions"><button class="btn small primary" data-approve="${escapeHTML(p.id)}">등록</button><button class="btn small" data-dismiss="${escapeHTML(p.id)}" aria-label="거절">×</button></div>`}</div>`}
function inbox(){return `<div class="page-heading"><div><p class="eyebrow">SMART CHAT CAPTURE</p><h1>▤ 채팅 일정 추출</h1><p class="subtitle">대화 속 날짜와 약속을 발견하고, 승인한 일정만 캘린더에 반영합니다.</p></div></div><div class="two-column"><div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">일정 후보 검토</h3><p class="panel-sub">추출한 내용은 자동으로 확정되지 않습니다.</p></div><span class="task-badge badge-orange">${state.proposals.length}개 대기</span></div>${state.proposals.length?state.proposals.map(p=>proposalMarkup(p)).join(''):'<div class="empty-note">검토할 일정이 없어요. 새 채팅 내용을 분석해 보세요!</div>'}</div></div><div class="panel" style="margin-top:19px"><div class="panel-head"><div><h3 class="panel-title">채팅 내용 가져오기</h3><p class="panel-sub">대화 텍스트를 붙여넣으면 일정 후보를 찾아줍니다.</p></div></div><form id="chatForm"><div class="field"><label for="chatSource">채팅 출처</label><select id="chatSource"><option>Discord</option><option>메신저</option><option>Slack</option></select></div><div class="field"><label for="chatText">대화 메시지</label><textarea id="chatText" required placeholder="예: 다음 주 금요일에 최종 발표 자료 리뷰하자."></textarea></div><button class="btn primary" type="submit">✦ 일정 후보 찾기</button></form><p class="tip">봇이나 메신저 계정에 실제 연결된 상태가 아닙니다. API 연동 및 권한 동의는 별도 구현이 필요합니다.</p></div></div><div><div class="panel"><div class="panel-head"><div><h3 class="panel-title">외부 서비스 연결</h3><p class="panel-sub">서비스별 연동 예정 상태</p></div></div><div class="integration-grid"><div class="integration"><div class="integration-icon">🎮</div><strong>Discord</strong><small>봇이 접근 가능한 채널의 메시지 분석</small><div class="status">○ 미연결 · 설계 예정</div></div><div class="integration"><div class="integration-icon">💬</div><strong>Slack</strong><small>승인된 워크스페이스의 메시지 수집</small><div class="status">○ 미연결 · 확장 기능</div></div><div class="integration"><div class="integration-icon">📅</div><strong>Google Calendar</strong><small>외부 캘린더 동기화</small><div class="status">○ 미연결 · 확장 기능</div></div></div></div><div class="panel" style="margin-top:20px"><h3 class="panel-title">왜 승인 단계를 두나요?</h3><p class="helper" style="margin-top:13px">“금요일까지 가능할까요?”는 확정된 약속이 아닐 수 있습니다. 사람의 확인을 거치면 잘못된 자동 등록을 줄일 수 있고, 팀별 신뢰 규칙도 만들 수 있습니다.</p></div><div class="panel" style="margin-top:20px"><h3 class="panel-title">데모 기능 범위</h3><p class="helper" style="margin-top:13px">✓ 대화 붙여넣기 · 날짜 표현 인식<br/>✓ 일정 후보 확인 · 승인/거절<br/>✓ 로컬 캘린더 반영<br/>○ 실시간 봇 · 자연어 고급 추론 · 사용자 인증</p></div></div></div>`}
function render(){const views={dashboard,calendar,planner,meetings:meeting,inbox};$('#content').innerHTML=views[currentView]();$('#inboxCount').textContent=state.proposals.length;save()}
function addTask(title,date,source){state.tasks.push({id:'t'+Math.random().toString(36).slice(2,10),title,date,source,done:false})}function modal(html){$('#modalBody').innerHTML=html;$('#modalBackdrop').classList.remove('hidden')}function closeModal(){$('#modalBackdrop').classList.add('hidden')}function taskModal(){modal(`<h2>새 일정 추가</h2><p class="subtitle" style="margin-bottom:24px">팀 캘린더에 할 일을 직접 등록합니다.</p><form id="addTaskForm"><div class="field"><label>일정 이름</label><input id="newTaskTitle" required maxlength="90" placeholder="예: API 통합 테스트"/></div><div class="field"><label>날짜</label><input id="newTaskDate" required type="date" value="${selectedDate}"/></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">취소</button><button type="submit" class="btn primary">등록하기</button></div></form>`)}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n){go(n.dataset.view);return}const goto=e.target.closest('[data-goto]');if(goto){go(goto.dataset.goto);return}const month=e.target.closest('[data-month]');if(month){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(month.dataset.month),1);render();return}const day=e.target.closest('[data-date]');if(day){selectedDate=day.dataset.date;if(currentView==='dashboard')go('calendar');else render();return}if(e.target.closest('[data-calendar-today]')){calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);selectedDate=dateOffset(0);render();return}const check=e.target.closest('[data-toggle-task]');if(check){const t=state.tasks.find(t=>t.id===check.dataset.toggleTask);if(t){t.done=!t.done;render()}return}const app=e.target.closest('[data-approve]');if(app){const p=state.proposals.find(p=>p.id===app.dataset.approve);if(p){addTask(p.title,p.date,'chat');state.proposals=state.proposals.filter(v=>v.id!==p.id);render();toast('일정이 캘린더에 등록되었습니다')}return}const dis=e.target.closest('[data-dismiss]');if(dis){state.proposals=state.proposals.filter(v=>v.id!==dis.dataset.dismiss);render();toast('일정 후보를 제외했습니다');return}if(e.target.closest('#addTask')||e.target.closest('#addSelectedTask')){taskModal();return}if(e.target.closest('#commitPlan')){const plan=state.lastPlan;if(plan){plan.steps.forEach(s=>addTask(s.title,s.date,'plan'));state.lastPlan=null;go('calendar');toast('실행 계획을 캘린더에 등록했습니다')}return}if(e.target.closest('#commitMeeting')){const m=state.lastMeeting;if(m){m.items.forEach(p=>addTask(p.title,p.date,'meeting'));state.lastMeeting=null;go('calendar');toast('회의 일정 후보를 등록했습니다')}return}if(e.target.closest('#modalClose')||e.target.closest('#cancelModal')||e.target===$('#modalBackdrop')){closeModal();return}if(e.target.closest('#goPlannerSide')){go('planner');return}if(e.target.closest('#resetData')){if(confirm('추가·수정한 데모 데이터를 초기화하시겠습니까?')){state=starter();calendarMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);go('dashboard');toast('데모 데이터를 초기화했습니다')}return}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='planForm'){const goal=$('#planGoal').value.trim(),desc=$('#planDesc').value.trim(),deadline=$('#planDeadline').value,intensity=$('#planIntensity').value;if(!goal||!deadline||deadline<dateOffset(0)){toast('유효한 목표와 마감일을 입력해 주세요');return}state.lastPlan=buildPlan(goal,desc,deadline,intensity);$('#planResult').innerHTML=renderPlanResult();save();toast('계획 초안을 생성했습니다');return}if(e.target.id==='meetingForm'){const name=$('#meetingName').value.trim(),text=$('#meetingText').value.trim();if(!name||!text)return;const items=extractText(text,'회의록');const snippets=text.split(/[\n.!?]+/).map(s=>s.trim()).filter(s=>/(결정|까지|진행|완료|공유|회의)/.test(s)).slice(0,3);state.lastMeeting={name,items,summary:(snippets.length?snippets.join(' / '):text.slice(0,180))};$('#meetingResult').innerHTML=renderMeetingResult();save();toast(`${items.length}개의 일정 후보를 추출했습니다`);return}if(e.target.id==='chatForm'){const text=$('#chatText').value.trim();if(!text)return;const items=extractText(text,$('#chatSource').value);state.proposals=[...items,...state.proposals];render();toast(`${items.length}개의 새 일정 후보를 찾았습니다`);return}if(e.target.id==='addTaskForm'){const title=$('#newTaskTitle').value.trim(),date=$('#newTaskDate').value;if(!title||!date)return;addTask(title,date,'plan');closeModal();render();toast('새 일정을 추가했습니다');return}});
render();

</script></body></html>
